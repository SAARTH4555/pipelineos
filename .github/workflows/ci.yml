name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never talks to HubSpot or a model: every HubSpot call runs against the in-memory fake,
# and the LLM classifier falls back to keyword rules. No secrets are needed.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Portal spec is valid and the field dictionary is current
        run: |
          uv run pipelineos validate
          uv run pipelineos dictionary --check

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked --group dev
      - run: uv run pytest --cov --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv build
      - name: Wheel installs and the CLI runs
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck dist/*.whl
          /tmp/wheelcheck/bin/pipelineos version
